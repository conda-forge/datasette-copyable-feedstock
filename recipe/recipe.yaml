# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: datasette-copyable
  version: "0.3.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 579a85963015a5b7f87b6cabcd63ce401065ee83f2ab5b34fe1c1515191167cf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<4.0
    - datasette >=0.63
    - tabulate

tests:
  - python:
      imports:
        - datasette_copyable
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  summary: Datasette plugin for outputting tables in formats suitable for copy and paste
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/simonw/datasette-copyable

extra:
  recipe-maintainers:
    - rxm7706
